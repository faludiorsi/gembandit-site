name: Meska szinkron

# Naponta egyszer lekéri a Meska-bolt aktív termékeit és számait, és ha változott,
# újraírja az index.html jelölt blokkjait (termékkártyák, számsor), majd commitol.
# A GitHub Pages a main ág gyökeréből szolgálja ki az oldalt, így a commit után frissül.
# Kézzel is indítható az Actions fülön ("Run workflow").

on:
  schedule:
    - cron: "17 4 * * *"   # minden nap 04:17 UTC (06:17 magyar idő)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Függőségek (csak a képkicsinyítéshez)
        run: pip install --quiet pillow
      - name: Szinkron a Meskáról
        run: python3 scripts/sync-meska.py
        env:
          SITE_DIR: .
      - name: Commit, ha változott
        run: |
          git config user.name "meska-sync"
          git config user.email "meska-sync@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nincs változás."
          else
            git add -A
            git commit -m "Meska szinkron: $(date -u +%Y-%m-%d)"
            git push
          fi
